    <p>이 사이트는 회원 가입 없이 이용할 수 있습니다. 서버에 계정정보를 저장하지 않습니다.</p>
    <h2>수집하는 정보</h2>
    <p>기본 접속 로그(기기 정보, 접속 시간, 브라우저 종류)가 GitHub Pages 호스팅 과정에서 처리될 수 있습니다. 광고를 켜는 경우 Google AdSense가 쿠키·기기 정보를 수집할 수 있습니다.</p>
    <h2>광고</h2>
    <p>광고 승인 후 제3자 광고가 표시될 수 있습니다. 광고 관련 정보 처리는 Google 정책을 따릅니다.</p>
