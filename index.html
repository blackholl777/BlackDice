<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BlackDice — 실용 도구</title>
  <meta name="description" content="무료로 쓰는 실용 도구. 환율, D-day, 텍스트 도구." />
  <link rel="stylesheet" href="styles.css" />
  <!-- AdSense: 승인 후 아래 주석 해제 후 client id 입력
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXX" crossorigin="anonymous"></script>
  -->
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="./">BlackDice</a>
      <nav>
        <a href="./">홈</a>
        <a href="./about.html">소개</a>
        <a href="./privacy.html">개인정보</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>누구나 쓸 수 있는 무료 도구</h1>
      <p>호스팅비 0원. 브라우저만 있으면 바로 쓸 수 있습니다.</p>
    </section>

    <div class="ad-slot" aria-label="광고 영역">광고 영역 — AdSense 승인 후 표시</div>

    <section class="grid">
      <article class="card">
        <h2>원/달러 참고</h2>
        <p id="fx">환율을 불러오는 중...</p>
        <button type="button" id="fx-refresh">다시 불러오기</button>
      </article>

      <article class="card">
        <h2>D-day</h2>
        <label>날짜 <input type="date" id="dday-date" /></label>
        <p id="dday-out">날짜를 고르면 남은 일수를 계산합니다.</p>
      </article>

      <article class="card">
        <h2>글자 수</h2>
        <textarea id="count-text" rows="5" placeholder="텍스트를 붙여 넣으세요"></textarea>
        <p id="count-out">0자</p>
      </article>
    </section>
  </main>

  <footer class="wrap foot">
    <p>© BlackDice · <a href="./privacy.html">개인정보처리방침</a></p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
